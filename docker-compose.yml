name: ruinarpg

x-api: &api
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    ConnectionStrings__Postgres: "Host=db;Database=ruinarpg;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    Jwt__SigningKey: ${JWT_SIGNING_KEY}
    Jwt__Issuer: ${JWT_ISSUER}
    Jwt__Audience: ${JWT_AUDIENCE}
    Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
    Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS}
    Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
    Storage__ImagesPath: /images
    Img__MaxSizeMb: ${IMG_MAX_SIZE_MB}
    Invite__CodeExpirationHours: ${INVITE_CODE_EXPIRATION_HOURS}
  volumes:
    - images:/images

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruinarpg
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the entrypoint's temporary init server listens only on the Unix socket, so a socket check went
      # green before the real server was up (and the next pg_dump/psql met "the database system is shutting down").
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ruinarpg"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Blue-green (Técnico R0014): deploy/deploy.sh starts the idle color with the new image, health-checks
  # it, and points nginx's upstream at it. Tags come from deploy/state/colors.env.
  api-blue:
    <<: *api
    image: ruinarpg-api:${BLUE_TAG:-none}
  api-green:
    <<: *api
    image: ruinarpg-api:${GREEN_TAG:-none}

  # Long-lived: never rebuilt by a deploy; config is bind-mounted and reloaded.
  # deploy/state/upstream.conf is a FILE bind mount: deploy.sh must rewrite it in place (cat > file),
  # never replace it with mv, or the container keeps the old inode.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      # The directory, not the file: a single-file bind mount pins the inode, and git checkout replaces
      # the file, so nginx -s reload would keep serving the old config. upstream.conf.example is not *.conf.
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - ./deploy/state/upstream.conf:/etc/nginx/upstream.conf:ro
      - webroot:/webroot:ro
      - images:/images:ro

  client-build:
    profiles: ["tools"]
    image: ruinarpg-client:${CLIENT_TAG:-none}
    volumes:
      - webroot:/webroot

  smoke:
    profiles: ["tools"]
    image: ruinarpg-smoke:${SMOKE_TAG:-none}
    environment:
      SMOKE_BASE_URL: ${SMOKE_BASE_URL:-http://api-blue:8080}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}

volumes:
  pgdata:
  images:
  webroot:
