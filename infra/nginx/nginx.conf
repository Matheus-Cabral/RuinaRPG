server {
    listen 80;

    location /api/ {
        # Matches ImagesController's [RequestSizeLimit(20_000_000)] on the Upload action — nginx's
        # default 1MB cap would otherwise 413 any upload before the API's own (configurable,
        # IMG_MAX_SIZE_MB) size check ever runs.
        client_max_body_size 20m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without this the Api only ever sees the nginx container's address, which
        # would collapse the per-IP rate limiter (Técnico R0006) into one global bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
